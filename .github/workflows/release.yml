# @invariants    1. Triggers strictly on annotated release tags (v*).
#                2. Verifies 5-block release tag manifest before packaging.
#                3. Compiles optimized Release binary stripped of debug symbols.
#                4. Packages standalone archive with launcher, ROMs, and guides.
#                5. Zero impact on daily feature branches or pull request velocity.
