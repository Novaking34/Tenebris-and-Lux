# ==============================================================================
# BLOCK 2: OPENING BLOCK / RELEASE TRIGGERS & PERMISSIONS
# Stratum: Layer 4 Verification | Machine: github.workflow.release
# ==============================================================================

name: Milestone Release Packaging

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# ==============================================================================
# BLOCK 3: BODY BLOCK / RELEASE PACKAGING ENGINE
# Stratum: Layer 4 Verification | Machine: github.workflow.release
# ==============================================================================

jobs:
  build-and-package-release:
    name: "Package Milestone Release Distribution"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies & Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libx11-dev libxft-dev asciidoctor asciidoctor-pdf

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools

      - name: Audit Milestone Release Tag Manifest (OmniCode 5-Block Protocol)
        run: cargo run --manifest-path tools/Cargo.toml --bin git_validator -- --tags

      - name: Configure CMake (Release Optimization Mode)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Engine & Stripped Binaries
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Compile Master Guide Compendiums & Volume Books
        run: cargo run --manifest-path tools/Cargo.toml --bin master_guide -- --all

      - name: Assemble Release Distribution Tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIST_DIR="dist/tenebris-lux-${VERSION}-linux-x64"
          mkdir -p "${DIST_DIR}"

          # Core binaries (packaged from canonical build/bin/ or root symlink)
          if [ -f "build/bin/tenebris-lux" ]; then
            cp build/bin/tenebris-lux "${DIST_DIR}/tenebris-lux"
          else
            cp build/tenebris-lux "${DIST_DIR}/tenebris-lux"
          fi
          strip "${DIST_DIR}/tenebris-lux"

          # Native developer & launcher tooling
          cargo build --manifest-path tools/Cargo.toml --bin tl_tools --bin launcher --bin installer --release
          cp tools/target/release/tl_tools "${DIST_DIR}/"
          cp tools/target/release/launcher "${DIST_DIR}/"
          cp tools/target/release/installer "${DIST_DIR}/"
          strip "${DIST_DIR}/tl_tools" "${DIST_DIR}/launcher" "${DIST_DIR}/installer"

          # Configs, Data & Documentation
          cp -r engine/config "${DIST_DIR}/engine_config"
          cp -r game/data "${DIST_DIR}/game_data"
          cp README.md CHANGELOG.md LICENSE AGENTS.md "${DIST_DIR}/"
          cp docs/MASTER_GUIDE.pdf "${DIST_DIR}/" 2>/dev/null || true

          # Create distribution tarball
          tar -czvf "tenebris-lux-${VERSION}-linux-x64.tar.gz" -C dist "tenebris-lux-${VERSION}-linux-x64"

      - name: Publish GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tenebris-lux-${{ github.ref_name }}-linux-x64.tar.gz
            docs/MASTER_GUIDE.pdf
          draft: true
          generate_release_notes: true

# ==============================================================================
# BLOCK 4: AUDIT PROCEDURES / VERIFICATION PROOFS & TELEMETRY TRIPWIRES
# Stratum: Layer 4 Verification | Machine: github.workflow.release
# ==============================================================================
# Release Audit Invariants:
#   - Tag must adhere to SemVer vX.Y.Z convention.
#   - Tag message must contain full 5-block tag manifest.
#   - Release distribution must contain stripped C binary and standalone launcher.
#   - Standalone engine boots cleanly even without external disk assets.
