name: CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libx11-dev libxft-dev asciidoctor

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Git Commits & Milestone Release Tags (Universal 5-Block Protocol)
        run: cargo run --manifest-path tools/Cargo.toml --bin git_validator

      - name: Audit System Data Schemas & Manifests
        run: cargo run --manifest-path tools/Cargo.toml --bin validator -- system

      - name: Execute Rust Developer Toolchain Tests (19/19 Tests)
        run: cargo test --manifest-path tools/Cargo.toml

      - name: Configure CMake (Debug)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build Engine, Simulation & Test Harnesses
        run: cmake --build build --config Debug

      - name: Execute CTest Verification Suite (51/51 Suites)
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Execute Pre-Flight Self-Audit & Invariant Tripwires (20/20 Modules)
        run: ./build/tenebris-lux --audit

      - name: Compile Master Guide Volumes & Compendium via Rust Toolchain
        run: cargo run --manifest-path tools/Cargo.toml --bin master_guide -- --all
