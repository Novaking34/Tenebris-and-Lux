# ==============================================================================
# BLOCK 2: OPENING BLOCK / PIPELINE TRIGGERS & CONCURRENCY CONTROLS
# Stratum: Layer 4 Verification | Machine: github.workflow.ci
# ==============================================================================

name: CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==============================================================================
# BLOCK 3: BODY BLOCK / PARALLEL JOB MATRIX & EXECUTION ENGINES
# Stratum: Layer 4 Verification | Machine: github.workflow.ci
# ==============================================================================

jobs:
  # ----------------------------------------------------------------------------
  # 3.1 Job: Cornerstone Game Engine & Turn Simulation Verification
  # ----------------------------------------------------------------------------
  engine-and-game:
    name: "Cornerstone Engine & Game Sim (C23/C11 Ladder)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libx11-dev libxft-dev ccache

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure CMake (Debug Mode w/ ccache)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Engine, Simulation & Test Harnesses
        run: cmake --build build --config Debug --parallel $(nproc)

      - name: Execute CTest 4-Tier Verification Suite (65/65 Suites)
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Execute Pre-Flight Subsystem Self-Audit & Invariant Tripwires (20 Modules)
        run: ./build/tenebris-lux --audit

      - name: Execute Deterministic CLI Simulation Smoke Test
        run: echo "quit" | ./build/tenebris-lux --cli

      - name: Execute Tier-0 Safe-Mode BIOS ROM Fallback Test
        run: ./build/tenebris-lux -r /tmp/nonexistent_fallback_root --audit

  # ----------------------------------------------------------------------------
  # 3.2 Job: Developer Toolchain, Schemas & Ledger Validation
  # ----------------------------------------------------------------------------
  developer-toolchain:
    name: "Rust Toolchain & 5-Block Schema Validator"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies & Build Outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools

      - name: Execute Rust Developer Toolchain Tests (31/31 Unit Tests)
        run: cargo test --manifest-path tools/Cargo.toml

      - name: Audit Git History, C11 Headers & 5-Block JSON Data Manifests
        run: cargo run --manifest-path tools/Cargo.toml --bin tl_tools -- validate all

  # ----------------------------------------------------------------------------
  # 3.3 Job: Cognitive Exoskeleton & Python Orchestrator Verification
  # ----------------------------------------------------------------------------
  orchestrator-and-exoskeleton:
    name: "Python Orchestrator & Hardware Probes"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute Model Factory & Tri-State Modelfile Verification
        run: python3 tools/orchestrator/tests/test_model_factory.py

      - name: Execute Dynamic Auto Mode & Sovereign Local Handshake Verification
        run: python3 tools/orchestrator/tests/test_auto_mode.py

      - name: Execute OmniCode 7-Tier Staircase & Bedrock Sweep Verification
        run: python3 tools/orchestrator/tests/test_staircase_sweep.py

  # ----------------------------------------------------------------------------
  # 3.4 Job: Master Guide Compendiums & Link Discipline
  # ----------------------------------------------------------------------------
  documentation-and-compendiums:
    name: "Master Guide Compendiums & Link Discipline"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Documentation Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor asciidoctor-pdf

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies & Build Outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools

      - name: Compile Master Guide Volumes & Compendiums (6 Volumes)
        run: cargo run --manifest-path tools/Cargo.toml --bin master_guide -- --all

      - name: Audit Repository Markdown Link Discipline (Zero file:/// URIs)
        run: |
          echo "[AUDIT] Checking for illegal file:/// URIs in tracked documentation..."
          if grep -rn "file:///" README.md CHANGELOG.md AGENTS.md 2>/dev/null; then
            echo "[ERROR] Found prohibited absolute file:/// links in repository documentation!" >&2
            exit 1
          fi
          echo "[AUDIT] 100% repo-relative link discipline verified."

